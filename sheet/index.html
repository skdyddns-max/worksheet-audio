<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학습지 듣기</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;background:#F6FBF8;color:#1F2A24;margin:0;padding:22px 18px}
.card{background:#fff;border:1.5px solid #CFE6D8;border-radius:16px;padding:18px;max-width:520px;margin:0 auto 14px}
h1{font-size:18px;margin:0 0 4px;color:#1F4D3A}h2{font-size:15px;margin:0 0 8px}small{color:#6B7A72}audio{width:100%;margin-top:10px}
.brand{text-align:center;color:#6B7A72;font-size:12px;margin-top:18px}.err{color:#B4432F}
</style></head><body>
<div class="card"><h1 id="h">🔊 학습지 전체 듣기</h1><small id="g">문제마다 재생을 눌러요.</small><p class="err" id="e"></p></div>
<div id="list"></div>
<div class="brand">용디쌤 · TalkBloom 언어학습지</div>
<script>
const s=new URLSearchParams(location.search).get('s')||'';
const E=document.getElementById('e');
const esc=t=>String(t||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const MAX=40, WAIT=5000;
const retryAudio=a=>{let k=0,ok=false;a.addEventListener('canplay',()=>{ok=true;});
  a.onerror=()=>{if(ok||k++>=MAX)return;setTimeout(()=>{a.src='../clips/'+a.dataset.c+'.mp3?t='+Date.now();a.load();},WAIT);};};
const get=n=>fetch('../sheets/'+s+'.json'+(n?('?t='+Date.now()):'')).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{
  E.textContent='';
  if(d.grade)document.getElementById('g').textContent=d.grade+' · 문제마다 재생을 눌러요.';
  document.getElementById('list').innerHTML=(d.clips||[]).map(c=>`<div class="card"><h2>${c.no}번 · ${esc(c.tag)}</h2><audio controls preload="none" data-c="${esc(c.clip)}" src="../clips/${esc(c.clip)}.mp3"></audio></div>`).join('');
  document.querySelectorAll('audio[data-c]').forEach(retryAudio);
}).catch(()=>{
  // 방금 만든 학습지는 공개 사이트 반영까지 1분쯤 걸린다 → 5초마다 다시 부른다(최대 약 3분)
  if(n>=MAX){E.textContent='목록을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.';return;}
  E.textContent='음성 목록을 준비하고 있어요… 잠시만 기다려 주세요 ('+((n+1)*5)+'초)';
  setTimeout(()=>get(n+1),WAIT);
});
if(!/^[\w\-]{3,40}$/.test(s)){E.textContent='잘못된 주소예요.';}
else get(0);
</script></body></html>
