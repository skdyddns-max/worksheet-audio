<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문제 듣기</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;background:#F6FBF8;color:#1F2A24;margin:0;padding:22px 18px}
.card{background:#fff;border:1.5px solid #CFE6D8;border-radius:16px;padding:18px;max-width:520px;margin:0 auto 14px}
h1{font-size:18px;margin:0 0 4px;color:#1F4D3A}small{color:#6B7A72}audio{width:100%;margin-top:10px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:12px;background:#2E7D5B;color:#fff;font-size:18px;font-weight:700;margin-top:12px}
details{margin-top:10px;font-size:14px;color:#3C4A43}.brand{text-align:center;color:#6B7A72;font-size:12px;margin-top:18px}.err{color:#B4432F}
</style></head><body>
<div class="card"><h1>🔊 문제 듣기</h1><small>재생을 누르면 문제를 읽어 줘요. 다시 듣기는 재생을 한 번 더.</small>
<audio id="a" controls preload="auto"></audio>
<button class="btn" onclick="var a=document.getElementById('a');a.currentTime=0;a.play();">▶ 다시 듣기</button>
<details><summary>대본 보기(어른용)</summary><p id="t">불러오는 중…</p></details><p class="err" id="e"></p></div>
<div class="brand">용디쌤 · TalkBloom 언어학습지</div>
<script>
const c=new URLSearchParams(location.search).get('c')||'';
const A=document.getElementById('a'),E=document.getElementById('e'),T=document.getElementById('t');
const MAX=40, WAIT=5000; let tries=0, ready=false;
if(!/^[0-9a-f]{8,32}$/.test(c)){E.textContent='잘못된 주소예요.';}
else{
  // 방금 만든 학습지는 공개 사이트에 올라가기까지 1분쯤 걸린다 → 실패하면 캐시를 피해 5초마다 다시 부른다(최대 약 3분)
  const load=()=>{A.src='../clips/'+c+'.mp3'+(tries?('?t='+Date.now()):'');A.load();};
  A.addEventListener('canplay',()=>{ready=true;E.textContent='';});
  A.onerror=()=>{
    if(ready)return;
    tries++;
    if(tries>MAX){E.textContent='음성을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.';return;}
    E.textContent='음성을 준비하고 있어요… 잠시만 기다려 주세요 ('+(tries*5)+'초)';
    setTimeout(load,WAIT);
  };
  const script=n=>fetch('../clips/'+c+'.json'+(n?('?t='+Date.now()):'')).then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(d=>{T.textContent=(d&&d.text)||'(대본 없음)';})
    .catch(()=>{if(n<MAX)setTimeout(()=>script(n+1),WAIT);else T.textContent='(대본 없음)';});
  load();script(0);
}
</script></body></html>
